[package]
name = "utsu_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "utsu_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.2", features = ["extension-module", "abi3-py310"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
scraper = "0.18"
url = "2.5"
regex = "1.10"