[package]
name = "utsu_rust_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "utsu_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module", "abi3-py39"] }
reqwest = { version = "0.12.0", features = ["blocking", "rustls-tls"], default-features = false }
scraper = "0.19.0"
url = "2.5.0"